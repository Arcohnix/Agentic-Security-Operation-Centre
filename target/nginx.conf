user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # JSON access log — governance system parses this directly
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer",'
        '"request_length":$request_length'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens on;      # Expose version — attracts real scanners

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html;
        index index.html;

        # Expose common attack surfaces
        location /admin { return 200 "Admin Panel"; add_header Content-Type text/plain; }
        location /wp-login.php { return 200 "WordPress Login"; add_header Content-Type text/plain; }
        location /phpmyadmin { return 200 "phpMyAdmin"; add_header Content-Type text/plain; }
        location /.env { return 200 "DB_PASSWORD=secret123"; add_header Content-Type text/plain; }
        location /api/v1 { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
